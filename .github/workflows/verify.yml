name: Verify without release credentials

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test repository security guard
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check tracked files without printing credentials
        run: python3 scripts/check_repository_security.py
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '9.8.1'
          cache-disabled: true
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          test -r "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Compile, lint, and test without release credentials
        run: bash ./gradlew :app:assembleRelease :app:lintDebug :app:testDebugUnitTest --no-daemon --no-configuration-cache --console=plain
      - name: Require the unsigned release artifact
        run: test -f app/build/outputs/apk/release/app-release-unsigned.apk
      # Do not upload APKs, expose signing secrets, or publish releases in this workflow.
