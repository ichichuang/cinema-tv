name: Release signing frozen

# Incident containment: do not sign or upload APKs from this workflow.
# Historical reruns are not disabled by this file. Do not rerun old builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block release signing
        run: |
          echo '::error::Release signing is frozen pending credential migration and Android 11 in-place upgrade verification.'
          exit 1
