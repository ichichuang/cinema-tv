name: Release signing frozen

# Incident containment: do not sign or upload APKs from this workflow.
# Historical reruns are not disabled by this file. Do not rerun old builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout the reviewed publishing gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Block release signing
        run: python3 scripts/verify_release_candidate.py --check-publishing-gate
